<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingNote Pro - 회의록 목록</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="theme.js"></script>
</head>

<body class="bg-page dark:bg-canvas text-ink dark:text-fg font-sans antialiased min-h-screen flex flex-col">

<header class="sticky top-0 z-30 bg-white dark:bg-canvas border-b border-line dark:border-edge">
  <div class="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-lg bg-ink dark:bg-fg grid place-items-center text-white dark:text-canvas font-extrabold text-sm">M</div>
      <span class="font-extrabold tracking-tight">MeetingNote</span>
    </div>
    <nav class="flex items-center gap-1 text-[13px] font-bold ml-2 min-w-0 overflow-x-auto">
      <span class="px-2.5 py-1 rounded-lg bg-page dark:bg-chip">회의록</span>
      <a href="todos.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">할 일</a>
      <a href="team.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">팀</a>
      <a href="profile.html" class="px-2.5 py-1 rounded-lg text-ink-2 dark:text-dim hover:bg-page dark:hover:bg-chip transition">내 정보</a>
    </nav>
    <div class="ml-auto flex items-center gap-2 shrink-0">
      <span class="hidden sm:inline text-[12px] text-ink-3 dark:text-dim" id="teamName">기획팀</span>
      <div id="themeSlot"></div>
    </div>
  </div>
</header>

<main class="flex-1 w-full max-w-6xl mx-auto px-4 py-5">

  <!-- 검색 줄 -->
  <section class="rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge p-4 mb-4">
    <div class="flex flex-col sm:flex-row gap-2.5">
      <input id="q" type="search" placeholder="제목 또는 참석자로 검색"
        class="flex-1 h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge
               text-sm placeholder:text-ink-3 dark:placeholder:text-dim
               focus:outline-none focus:border-blue-dot focus:ring-2 focus:ring-blue-dot/25 transition">
      <div class="flex flex-wrap gap-2.5">
        <input id="from" type="date"
          class="h-11 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm
                 flex-1 min-w-0 basis-[calc(50%-0.3125rem)] sm:basis-auto sm:flex-none
                 focus:outline-none focus:border-blue-dot transition">
        <input id="to" type="date"
          class="h-11 px-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm
                 flex-1 min-w-0 basis-[calc(50%-0.3125rem)] sm:basis-auto sm:flex-none
                 focus:outline-none focus:border-blue-dot transition">
        <button id="newBtn"
          class="h-11 px-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold
                 w-full sm:w-auto
                 hover:opacity-90 active:scale-[.99] transition whitespace-nowrap">새 회의록</button>
      </div>
    </div>
  </section>

  <!-- 새 회의록 패널 -->
  <section id="newPanel" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge
           border-l-[6px] border-l-blue-dot p-5 mb-4">
    <h2 class="text-sm font-extrabold mb-3">새 회의록</h2>
    <div class="grid gap-3 sm:grid-cols-2">
      <div>
        <label class="block text-xs font-bold mb-1.5">제목</label>
        <input id="nTitle" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition" placeholder="2차 스프린트 계획 회의">
      </div>
      <div>
        <label class="block text-xs font-bold mb-1.5">회의 시각</label>
        <input id="nAt" type="datetime-local" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-xs font-bold mb-1.5">참석자</label>
        <input id="nWho" class="w-full h-11 px-3.5 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm focus:outline-none focus:border-blue-dot transition" placeholder="김대리, 박과장, 이주임">
      </div>
    </div>

    <!-- 녹취 올리기 -->
    <div id="dropZone" class="mt-3 rounded-xl border-2 border-dashed border-line dark:border-edge px-4 py-6 text-center">
      <p class="text-[13px] font-bold" id="dropTitle">녹취 파일을 끌어다 놓기</p>
      <p class="text-[11px] text-ink-3 dark:text-dim mt-1" id="dropSub">mp3 · wav · 25MB 이하. 또는 아래에 메모를 붙여넣기</p>
      <div id="progWrap" class="hidden mt-3">
        <div class="h-1.5 rounded-full bg-page dark:bg-chip overflow-hidden">
          <div id="prog" class="h-full bg-blue-dot transition-all" style="width:0%"></div>
        </div>
        <p id="progText" class="mt-1.5 text-[11px] font-bold text-blue-text dark:text-blue-dot"></p>
      </div>
    </div>
    <div id="dropErr" class="hidden mt-2.5"></div>

    <textarea id="nBody" rows="4" placeholder="받아쓴 본문 또는 붙여넣은 메모"
      class="mt-3 w-full px-3.5 py-3 rounded-xl bg-page dark:bg-chip border border-line dark:border-edge text-sm
             focus:outline-none focus:border-blue-dot transition"></textarea>

    <div class="mt-3 flex gap-2.5 justify-end">
      <button id="cancelBtn" class="h-11 px-4 rounded-xl bg-white dark:bg-chip border border-line dark:border-edge text-sm font-bold hover:border-ink dark:hover:border-dim transition">취소</button>
      <button id="saveBtn" class="h-11 px-4 rounded-xl bg-ink dark:bg-fg text-white dark:text-canvas text-sm font-bold hover:opacity-90 transition">정리하기</button>
    </div>
    <p class="mt-2.5 text-[11px] text-ink-3 dark:text-dim">저장하면 입력칸은 비워짐. 같은 회의록이 두 번 저장되지 않음</p>
  </section>

  <!-- 목록 -->
  <section>
    <div class="flex items-baseline gap-2 mb-3">
      <h2 class="text-sm font-extrabold">회의록</h2>
      <span id="count" class="text-[11px] text-ink-3 dark:text-dim"></span>
    </div>
    <div id="list" class="grid gap-2.5 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="empty" class="hidden rounded-2xl bg-white dark:bg-surface border border-line dark:border-edge px-5 py-12 text-center">
      <p class="text-sm font-bold" id="emptyTitle">아직 회의록이 없음</p>
      <p class="text-[12px] text-ink-2 dark:text-dim mt-1" id="emptySub">새 회의록 버튼으로 첫 회의를 올려 보기</p>
    </div>
  </section>
</main>

<script src="api.js"></script>
<script src="meetings.js"></script>
</body>
</html>
